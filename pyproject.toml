[project]
name = "prs"
version = "0.1.0"
description = "Project with separate environments for notebooks and app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "numpy",
    "nltk",
    "xgboost",
    "tabulate>=0.9.0",
    "unidecode",
    "spacy",
    "tqdm",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "bs4>=0.0.2",
    "lxml>=6.0.2",
    "contractions>=0.1.73",
    "pyspellchecker>=0.8.3",
    "pylance>=0.39.0",
    "wordcloud>=1.9.4",
    "lightgbm>=4.6.0",
]

[dependency-groups]
notebook = [
    "notebook",
    "matplotlib",
    "seaborn",
    "ipykernel>=7.1.0",
    "debugpy>=1.8.17",
    "scikit-learn>=1.7.2",
]
app = [
    "streamlit>=1.51.0",
]
